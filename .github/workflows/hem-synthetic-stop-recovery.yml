name: HEM Synthetic Stop Recovery

on:
  push:
    branches: [main]
    paths:
      - 'lab/hem_synthetic_contract.py'
      - 'tests/test_hem_synthetic_stop_recovery.py'
      - '.github/workflows/hem-synthetic-stop-recovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-counterproof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Execute four synthetic HEM guards
        run: python -m pytest -q tests/test_hem_synthetic_stop_recovery.py

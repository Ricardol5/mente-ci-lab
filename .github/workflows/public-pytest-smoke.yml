name: MENTE Public Pytest Smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-pytest-smoke.yml'
      - 'tests/test_public_runner.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run synthetic test
        run: python -m pytest -q tests/test_public_runner.py

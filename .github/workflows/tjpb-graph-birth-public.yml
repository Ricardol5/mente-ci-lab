name: TJ-PB Graph Birth Public Contract

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tjpb-graph-birth-public.yml'
      - 'tests/test_tjpb_graph_birth_public_contract.py'
      - 'receipts/tjpb-graph-birth-pr397.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tjpb-synthetic-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Public synthetic and receipt counterproof
        run: python -m pytest -q tests/test_tjpb_graph_birth_public_contract.py
